# .github/workflows/release.yml
name: Version

on:
  push:
    branches: [ "dev" ]

jobs:
  version:
    runs-on: ubuntu-22.04
    environment: Dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/version
        with:
          part: patch