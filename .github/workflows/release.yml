# .github/workflows/release.yml
name: Release

permissions:
  id-token: write

on:
  push:
    branches: [ "feature/GHAtions", "main" ]

jobs:
  version:
    runs-on: ubuntu-22.04
    environment: Prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

  wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: Prod
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/wheels

  publish:
    runs-on: ubuntu-22.04
    environment: Prod
    needs: wheels
    steps:
      - uses: ./.github/actions/publish