# .github/actions/setup/action.yml
name: "Setup Python"
description: "Set up Python with cache and install dependencies"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements_install.txt', 'requirements_dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - run: python -m pip install --upgrade pip
      shell: bash

    - run: pip install -r requirements_install.txt -r requirements_dev.txt
      shell: bash

    - run: pip install -e .
      shell: bash