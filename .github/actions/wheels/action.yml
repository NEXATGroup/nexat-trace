# .github/actions/wheels/action.yml
name: "Build Wheels"
description: "Build wheels using cibuildwheel"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - run: pip install cibuildwheel
      shell: bash

    - name: Build wheels
      shell: ${{ runner.os == 'Windows' && 'cmd' || 'bash' }}
      run: |
        echo "Start building wheels"
        cibuildwheel --output-dir wheelhouse > cibuildwheel.log 2>&1
        echo "Build finished, printing logs..."
        if [ "$RUNNER_OS" = "Windows" ]; then
          cmd.exe /c type cibuildwheel.log
        else
          cat cibuildwheel.log
        fi
      env:
        CIBW_SKIP: "pp* cp310-win32"
        CIBW_BUILD: "cp310-*"
        CIBW_VERBOSE: "1"

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ runner.os }}
        path: wheelhouse/*.whl