# .github/actions/wheels/action.yml
name: "Build Wheels"
description: "Build wheels using cibuildwheel"
runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - run: pip install cibuildwheel
      shell: bash

    - name: Build wheels
      run: cibuildwheel --output-dir wheelhouse
      shell: bash
      env:
        CIBW_SKIP: "pp* cp310-win32"
        CIBW_BUILD: "cp310-*"
        CIBW_VERBOSE: "1"

    - uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ runner.os }}
        path: wheelhouse/*.whl