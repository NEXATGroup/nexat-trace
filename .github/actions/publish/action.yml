# .github/actions/publish/action.yml
name: "Publish to PyPI"
description: "Publish built wheels to PyPI"

inputs:
  python-versions:
    description: "Space separated list of python versions"
    required: true
  os-list:
    description: "Space separated list of operating systems"
    required: true

runs:
  using: "composite"
  steps:

    - name: Download all wheel artifacts
      shell: bash
      run: |
        mkdir -p dist
        for py in ${{ inputs.python-versions }}; do
          for os in ${{ inputs.os-list }}; do
            name="wheels-${py}-${os}"
            echo "Downloading $name"
            gh run download-artifact "$name" --path dist || echo "Skipping $name"
          done
        done

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install twine
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install twine

    - name: Publish to PyPI
      shell: bash
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ env.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*